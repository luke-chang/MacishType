# Pinned external resources—edit by hand to bump versions, or run
# `make update-resources` (from macos/ or fcitx5/).
#
# Each line: <output-path-relative-to-repo-root> <source-url> <processor-or-dash> [section]
#   "<processor>"  scripts/<processor> is invoked with (input, output, url, [section]).
#   "-"            Verbatim copy, no processing.
#   "[section]"    Optional 4th column passed to the processor as a 4th argument,
#                  e.g. which section of a multi-section source to extract. Lines
#                  sharing one source-url are downloaded once (cached per run).
#
# `make update-resources` queries the default-branch HEAD of each github.com
# upstream and bumps the pinned SHA. Manual edits also work.

